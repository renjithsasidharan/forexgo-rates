name: Update rates
on:
  schedule:
    - cron: "30 16 * * *"   # daily, after most central banks publish
  workflow_dispatch:         # manual "Run workflow" button

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        run: |
          curl -sf "https://api.frankfurter.dev/v2/rates?base=usd" -o raw.json
          jq '{base:"USD", updated:(now|todate),
               rates:(map({key:.quote, value:{rate:.rate, date:.date}})|from_entries)}' \
             raw.json > rates.json
          rm raw.json
      - name: Commit
        run: |
          git config user.name  "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git push)
